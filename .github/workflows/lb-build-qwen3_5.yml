name: LB Sidecar Build (qwen3_5-cu130)

# Builds the /ping-sidecar wrapper around vllm/vllm-openai:qwen3_5-cu130 for
# RunPod Serverless load-balancing endpoints serving Qwen3.5/3.6 models.
# Pushes to ghcr.io as worker-vllm:lb-qwen3_5.

on:
  workflow_dispatch: {}
  push:
    branches: [lb-sidecar]
    paths:
      - 'lb-image-qwen3_5/**'
      - '.github/workflows/lb-build-qwen3_5.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./lb-image-qwen3_5
          file: ./lb-image-qwen3_5/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-vllm:lb-qwen3_5
          cache-from: type=gha,scope=lb-qwen3_5
          cache-to: type=gha,mode=max,scope=lb-qwen3_5
