name: LB Sidecar Build

# Builds the /ping-sidecar wrapper around vllm/vllm-openai:cu129-nightly for
# RunPod Serverless load-balancing endpoints. Pushes to ghcr.io as
# worker-vllm:lb-cu129.

on:
  workflow_dispatch: {}
  push:
    branches: [lb-sidecar]
    paths:
      - 'lb-image/**'
      - '.github/workflows/lb-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./lb-image
          file: ./lb-image/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-vllm:lb-cu129
          cache-from: type=gha,scope=lb
          cache-to: type=gha,mode=max,scope=lb
