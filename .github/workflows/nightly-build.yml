name: Nightly Build

# Builds worker-vllm with VLLM_NIGHTLY=true and pushes to GHCR. Used to get a
# fresher vLLM than the upstream v2.18.1 (vLLM 0.19.1, May 2025) — needed for
# DeepSeek-V4, MiniMax-M2.7, Qwen3.6 tool-call parsers, etc.

on:
  workflow_dispatch: {}
  push:
    branches: [nightly-image]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # The CUDA image + nightly vLLM wheel is huge. Free up the standard
        # GitHub runner before the build crashes on ENOSPC.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VLLM_NIGHTLY=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-vllm:nightly
            ghcr.io/${{ github.repository_owner }}/worker-vllm:nightly-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
